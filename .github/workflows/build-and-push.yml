# build-and-push.yml - Build and publish multi-arch PBX image to GHCR
# -------------------------------------------------------------------
# This workflow builds the Asterisk/Twilio PBX Docker image for multiple
# architectures (amd64 and ARM variants) and publishes it to GitHub Container
# Registry (GHCR). It is triggered on pushes to the main branch.

name: Build and push PBX image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and push multi-arch image to GHCR
    runs-on: ubuntu-latest

    permissions:
      # Required to push to GitHub Container Registry using the GITHUB_TOKEN.
      contents: read
      packages: write

    steps:
      - name: Check out repository
        # Fetch the repository contents so that Docker has access to the
        # Dockerfile, Asterisk configuration, and other project files.
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform builds
        # QEMU allows the Docker Buildx builder to emulate non-native
        # architectures (such as arm/v7 and arm64) on the GitHub-hosted
        # amd64 runners, enabling multi-arch image builds.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        # Buildx provides advanced build capabilities, including multi-arch
        # support and cache management. We create a new builder instance and
        # set it as the default for subsequent build commands.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Authenticate with GHCR using the GitHub Actions-provided token. This
        # allows the workflow to push images to ghcr.io under the current
        # repository owner.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        # Build the PBX Docker image for multiple architectures and push it to
        # GHCR. The image is tagged with `latest` under the repository owner's
        # namespace. The Dockerfile is located in ./docker and the build
        # context is the repository root.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/asterisk-twilio-pbx:latest
            ghcr.io/${{ github.repository_owner }}/asterisk-twilio-pbx:${{ github.sha }}
          # Optionally, build arguments or labels could be added here to
          # record build-time metadata (such as git SHA, build date, etc.).

  # Scan the image just pushed and publish its SBOM to the Tiger Blue SBOM
  # service, so the PBX image is tracked next to the hosted services.
  # Scans the manifest for the runner's platform (linux/amd64); the arm
  # variants are built from the same Dockerfile and differ only in the
  # architecture of the same Debian packages.
  sbom:
    name: Trivy scan + SBOM of the pushed image
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/asterisk-twilio-pbx:${{ github.sha }}
      TIGER_WATCH_URL: ${{ vars.TIGER_WATCH_URL || 'https://tiger-watch.fly.dev' }}
      TIGER_WATCH_API_KEY: ${{ secrets.TIGER_WATCH_API_KEY }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

      - name: Trivy vulnerability scan (table)
        # Non-blocking: the image is already pushed by the time this runs,
        # and the base is debian:bullseye-slim, which is past its security
        # support — the first runs establish how much that costs.
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Generate SBOM
        # SPDX-JSON: the only format the Tiger Blue SBOM service parses. The
        # document is named after the image reference, so each build is a
        # new document and the history stays.
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Publish SBOM to Tiger Watch
        # Needs the TIGER_WATCH_API_KEY repository secret (the shared upload
        # key the other Tiger Blue repos use); skipped with a warning until
        # it is set.
        if: github.ref == 'refs/heads/main' && env.TIGER_WATCH_API_KEY != ''
        run: |
          curl -sf --retry 3 --retry-delay 5 -X POST \
            "${TIGER_WATCH_URL}/sbom/upload" \
            -H "X-API-Key: ${TIGER_WATCH_API_KEY}" \
            -F "file=@sbom.spdx.json" \
            -F "vendor=tigerblue" \
            -F "device_type=container:asterisk-twilio-pbx" \
            -F "notes=CI ${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: SBOM not published (no key)
        if: github.ref == 'refs/heads/main' && env.TIGER_WATCH_API_KEY == ''
        run: echo "::warning::TIGER_WATCH_API_KEY is not set on this repository; the SBOM was built but not published to Tiger Watch."
