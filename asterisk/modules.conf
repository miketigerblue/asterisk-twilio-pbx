; modules.conf - Asterisk module load configuration
; -------------------------------------------------
; This file controls which Asterisk modules are loaded at start-up. For
; security and performance we aim to load only what we need, but we also want
; to respect the dependency resolution performed by the packaged Asterisk on
; Alpine. The safest approach in this environment is:
;   - Enable autoload, so core and dependency modules are loaded as intended.
;   - Explicitly disable legacy or unused modules that we know we do not want
;     (e.g. chan_sip, DAHDI, MGCP, etc.).
;
; This avoids having to maintain an exhaustive list of `load =` lines (which
; can easily become inconsistent with the package’s expectations) whilst still
; reducing the attack surface.

[modules]

; ------------------------------
; Autoload behaviour
; ------------------------------
; Let Asterisk load modules automatically, resolving dependencies (including
; those for PJSIP and RTP) according to its own module metadata.

autoload=yes

; ------------------------------
; Modules we do not want
; ------------------------------
; Legacy channel drivers. This PBX is PJSIP-only; chan_sip is deprecated
; (removed in Asterisk 21) and, when autoloaded, binds udp/5060 ahead of the
; PJSIP UDP transport, so the extensions would register against the wrong
; stack. chan_iax2 listens on udp/4569 for a protocol nothing here speaks.
noload => chan_sip.so
noload => chan_iax2.so

; Modules the Alpine asterisk package builds but whose runtime dependencies
; are not installed in this image (IMAP, sqlite3 CDR/CEL, HEP capture, the
; HTTP media cache and the WebSocket transport). They fail at start-up with
; an ERROR line each; nothing here uses them.
noload => app_voicemail_imap.so
noload => cdr_sqlite3_custom.so
noload => cel_sqlite3_custom.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
noload => res_http_media_cache.so
noload => res_pjsip_transport_websocket.so

; End of modules.conf
